<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#03080f"/>
<title>DREV Assist Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  color-scheme: dark;
  --bg:       #03080f;
  --surface:  #070f1b;
  --surface-hi: #0c1a2e;
  --surface-2:  #112238;
  --border:   rgba(0,200,255,.08);
  --border-hi: rgba(0,200,255,.22);
  --accent:   #00c8ff;
  --accent-dim: rgba(0,200,255,.12);
  --warn:     #ff6b2b;
  --good:     #00e5a0;
  --text:     #ddeef8;
  --text-2:   #5a8ea8;
  --text-3:   #264560;
  --s-submitted: #ff9f43;
  --s-reviewed:  #00c8ff;
  --s-dispatched: #ffd93d;
  --s-complete:  #00e5a0;
  --s-cancelled: #5a8ea8;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 500 15px/1.4 Rajdhani, sans-serif; -webkit-font-smoothing: antialiased; }
[hidden], .hidden { display: none !important; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; cursor: pointer; background: none; border: none; color: inherit; -webkit-tap-highlight-color: transparent; }
button:disabled { opacity: .5; cursor: wait; }
input { font: inherit; background: none; border: none; color: inherit; }

/* ── Login ────────────────────────────────────────────── */
.login-wrap {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: radial-gradient(ellipse at 50% 30%, rgba(0,200,255,.05), transparent 60%);
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--border-hi);
  border-radius: 20px;
  padding: 44px 36px;
  max-width: 400px;
  width: 100%;
  text-align: center;
}
.login-card::before {
  content: '';
  display: block;
  width: 56px; height: 56px;
  border-radius: 50%;
  border: 1.5px solid var(--border-hi);
  background: var(--accent-dim);
  margin: 0 auto 24px;
}
.login-logo { font: 700 17px/1 Orbitron; letter-spacing: 3px; margin-bottom: 4px; }
.login-logo span { color: var(--accent); }
.login-sub { font: 500 9px Orbitron; letter-spacing: 2.5px; color: var(--text-2); margin-bottom: 36px; }
.login-label { display: block; font: 500 9px Orbitron; letter-spacing: 1.8px; color: var(--text-2); text-align: left; margin-bottom: 8px; }
.login-input {
  width: 100%; padding: 14px 16px;
  background: var(--surface-hi);
  border: 1px solid var(--border-hi);
  border-radius: 10px;
  font: 600 15px Rajdhani;
  color: var(--text);
  letter-spacing: 1px;
  margin-bottom: 14px;
  transition: border-color .15s;
}
.login-input:focus { outline: none; border-color: var(--accent); }
.login-btn {
  width: 100%; padding: 16px;
  background: var(--accent);
  border-radius: 10px;
  font: 700 11px Orbitron;
  letter-spacing: 1.5px;
  color: var(--bg);
  transition: filter .15s;
}
.login-btn:hover { filter: brightness(1.1); }
.login-err { color: var(--warn); font-size: 13px; margin-top: 12px; min-height: 18px; }

/* ── Dashboard ────────────────────────────────────────── */
.dash {
  display: grid;
  grid-template-columns: 220px 1fr;
  height: 100dvh;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sb-logo {
  padding: 26px 20px 20px;
  border-bottom: 1px solid var(--border);
}
.sb-logo .wm { font: 700 13px/1 Orbitron; letter-spacing: 2px; }
.sb-logo .wm span { color: var(--accent); }
.sb-logo .sub { font: 500 8px Orbitron; letter-spacing: 2px; color: var(--text-2); margin-top: 4px; }

.sb-filters {
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
  overflow-y: auto;
}
.filter-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: background .12s;
}
.filter-row:hover { background: var(--surface-hi); }
.filter-row.active { background: var(--surface-2); }
.filter-label { font: 600 10px Orbitron; letter-spacing: 1px; color: var(--text-2); }
.filter-count { font: 700 16px Orbitron; color: var(--text-3); min-width: 28px; text-align: right; font-variant-numeric: tabular-nums; }

.filter-row[data-f="all"] .filter-label { color: var(--text-2); }
.filter-row[data-f="all"].active .filter-label { color: var(--text); }
.filter-row[data-f="all"].active .filter-count { color: var(--text); }
.filter-row[data-f="submitted"] .filter-label { color: var(--s-submitted); }
.filter-row[data-f="submitted"] .filter-count { color: var(--s-submitted); }
.filter-row[data-f="reviewed"] .filter-label { color: var(--s-reviewed); }
.filter-row[data-f="reviewed"] .filter-count { color: var(--s-reviewed); }
.filter-row[data-f="dispatched"] .filter-label { color: var(--s-dispatched); }
.filter-row[data-f="dispatched"] .filter-count { color: var(--s-dispatched); }
.filter-row[data-f="complete"] .filter-label { color: var(--s-complete); }
.filter-row[data-f="complete"] .filter-count { color: var(--s-complete); }
.filter-row[data-f="cancelled"] .filter-label { color: var(--s-cancelled); }
.filter-row[data-f="cancelled"] .filter-count { color: var(--s-cancelled); }

.sb-bottom {
  padding: 14px 12px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sb-link {
  padding: 10px 12px;
  border: 1px solid var(--border-hi);
  border-radius: 8px;
  font: 600 9px Orbitron;
  letter-spacing: 1px;
  color: var(--text-2);
  text-align: center;
  transition: color .12s, border-color .12s;
}
.sb-link:hover { color: var(--accent); border-color: var(--accent); text-decoration: none; }

/* Main */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.main-hdr {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  gap: 12px;
}
.main-title { font: 700 14px Orbitron; letter-spacing: 2px; }
.main-hdr-actions { display: flex; gap: 8px; align-items: center; }
.hdr-btn {
  padding: 9px 16px;
  background: var(--surface-hi);
  border: 1px solid var(--border-hi);
  border-radius: 8px;
  font: 600 9px Orbitron;
  letter-spacing: 1px;
  color: var(--text-2);
  transition: color .12s, border-color .12s;
}
.hdr-btn:hover { color: var(--accent); border-color: var(--accent); }

.req-list {
  flex: 1;
  overflow-y: auto;
  padding: 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.req-list::-webkit-scrollbar { width: 4px; }
.req-list::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }

/* Empty / loading */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  padding: 80px 24px; color: var(--text-2); text-align: center; gap: 10px;
}
.empty-state .e-icon { font-size: 32px; opacity: .25; }
.empty-state .e-text { font: 600 10px Orbitron; letter-spacing: 2px; }
.spinner {
  width: 32px; height: 32px;
  border: 2px solid var(--border-hi);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 80px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Request card */
.req-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  transition: border-color .15s;
}
.req-card:hover { border-color: var(--border-hi); }
.req-card[data-status="submitted"] { border-left: 3px solid var(--s-submitted); }
.req-card[data-status="reviewed"]  { border-left: 3px solid var(--s-reviewed); }
.req-card[data-status="dispatched"] { border-left: 3px solid var(--s-dispatched); }
.req-card[data-status="complete"]  { border-left: 3px solid var(--s-complete); }

.req-left { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.req-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.req-id { font: 600 11px Orbitron; letter-spacing: .8px; color: var(--accent); font-variant-numeric: tabular-nums; }
.req-time { font-size: 12px; color: var(--text-2); }
.cat-chip {
  padding: 2px 7px;
  border-radius: 100px;
  font: 600 8px Orbitron;
  letter-spacing: .6px;
  border: 1px solid;
}
.cat-chip.c-roadside { color: #a78bfa; border-color: rgba(167,139,250,.3); }
.cat-chip.c-home     { color: #34d399; border-color: rgba(52,211,153,.3); }
.req-svc { font: 600 14px Rajdhani; color: var(--text); }
.req-loc { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.req-cust { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.req-cust-item { font-size: 13px; color: var(--text-2); }
.req-cust-item strong { color: var(--text); }
.req-notes { font-size: 12px; color: var(--text-2); font-style: italic; margin-top: 2px; }

.req-right {
  display: flex; flex-direction: column;
  align-items: flex-end; justify-content: space-between;
  gap: 8px; min-width: 110px;
}
.status-badge {
  padding: 4px 10px;
  border-radius: 100px;
  font: 600 8px Orbitron;
  letter-spacing: .8px;
  border: 1px solid;
}
.s-submitted { color: var(--s-submitted); border-color: rgba(255,159,67,.35); background: rgba(255,159,67,.06); }
.s-reviewed  { color: var(--s-reviewed);  border-color: rgba(0,200,255,.35); background: rgba(0,200,255,.06); }
.s-dispatched { color: var(--s-dispatched); border-color: rgba(255,217,61,.35); background: rgba(255,217,61,.06); }
.s-complete  { color: var(--s-complete);  border-color: rgba(0,229,160,.35); background: rgba(0,229,160,.06); }
.s-cancelled { color: var(--s-cancelled); border-color: rgba(90,142,168,.35); background: rgba(90,142,168,.06); }

.req-actions { display: flex; flex-direction: column; gap: 4px; }
.act-btn {
  padding: 6px 11px;
  background: var(--surface-hi);
  border: 1px solid var(--border-hi);
  border-radius: 6px;
  font: 600 8px Orbitron;
  letter-spacing: .8px;
  color: var(--text-2);
  transition: all .12s;
  white-space: nowrap;
}
.act-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
.act-btn.a-dispatch:hover { color: var(--s-dispatched); border-color: rgba(255,217,61,.4); background: rgba(255,217,61,.06); }
.act-btn.a-complete:hover { color: var(--s-complete); border-color: rgba(0,229,160,.4); background: rgba(0,229,160,.06); }
.act-btn.a-cancel:hover   { color: var(--warn); border-color: rgba(255,107,43,.4); background: rgba(255,107,43,.06); }

/* Toast */
.toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%);
  background: var(--surface-2);
  border: 1px solid var(--border-hi);
  border-radius: 100px;
  padding: 10px 20px;
  font: 600 11px Orbitron;
  letter-spacing: 1px;
  color: var(--good);
  z-index: 100;
  animation: toast-in .2s ease-out, toast-out .3s ease-in 2.2s forwards;
  pointer-events: none;
}
@keyframes toast-in  { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }
@keyframes toast-out { to   { opacity: 0; transform: translateX(-50%) translateY(10px); } }

@media (max-width: 680px) {
  .dash { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .sidebar { max-height: 180px; flex-direction: row; }
  .sb-logo { display: none; }
  .sb-filters { flex-direction: row; flex-wrap: wrap; padding: 8px; gap: 4px; overflow-x: auto; }
  .filter-row { flex: 0 0 auto; flex-direction: column; gap: 2px; padding: 8px 10px; min-width: 64px; text-align: center; justify-content: center; }
  .sb-bottom { flex-direction: row; border-top: none; border-left: 1px solid var(--border); }
  .req-card { grid-template-columns: 1fr; }
  .req-right { flex-direction: row; flex-wrap: wrap; justify-content: flex-start; align-items: center; }
}
</style>
</head>
<body>

<!-- Login -->
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="login-logo"><span>D</span>REV ASSIST</div>
    <div class="login-sub">MANAGER DASHBOARD</div>
    <label class="login-label" for="key-input">ADMIN ACCESS KEY</label>
    <input class="login-input" id="key-input" type="password" placeholder="Enter your admin key" autocomplete="off"/>
    <button class="login-btn" id="login-btn">ACCESS DASHBOARD</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- Dashboard -->
<div class="dash hidden" id="dash">
  <aside class="sidebar">
    <div class="sb-logo">
      <div class="wm"><span>D</span>REV ASSIST</div>
      <div class="sub">MANAGER</div>
    </div>

    <div class="sb-filters" id="sb-filters">
      <div class="filter-row active" data-f="all">
        <div class="filter-label">ALL</div>
        <div class="filter-count" id="c-all">—</div>
      </div>
      <div class="filter-row" data-f="submitted">
        <div class="filter-label">NEW</div>
        <div class="filter-count" id="c-submitted">—</div>
      </div>
      <div class="filter-row" data-f="reviewed">
        <div class="filter-label">REVIEWED</div>
        <div class="filter-count" id="c-reviewed">—</div>
      </div>
      <div class="filter-row" data-f="dispatched">
        <div class="filter-label">DISPATCHED</div>
        <div class="filter-count" id="c-dispatched">—</div>
      </div>
      <div class="filter-row" data-f="complete">
        <div class="filter-label">COMPLETE</div>
        <div class="filter-count" id="c-complete">—</div>
      </div>
      <div class="filter-row" data-f="cancelled">
        <div class="filter-label">CANCELLED</div>
        <div class="filter-count" id="c-cancelled">—</div>
      </div>
    </div>

    <div class="sb-bottom">
      <a class="sb-link" href="/">← CUSTOMER APP</a>
      <button class="sb-link" id="logout-btn">SIGN OUT</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-hdr">
      <div class="main-title" id="main-title">ALL REQUESTS</div>
      <div class="main-hdr-actions">
        <button class="hdr-btn" id="refresh-btn">↻ REFRESH</button>
      </div>
    </div>
    <div class="req-list" id="req-list">
      <div class="spinner"></div>
    </div>
  </main>
</div>

<script>
const API = '/api/assist/admin';
let adminKey = '';
let allRequests = [];
let activeFilter = 'all';

const svcNames = {
  'mobile-ev-charge':    'Mobile EV Charge',
  'fuel-delivery':       'Fuel Delivery',
  'jump-start':          'Jump Start',
  'flat-tire':           'Flat Tire',
  'lockout':             'Lockout',
  'tow-coordination':    'Tow Coordination',
  'collision-incident':  'Collision Incident',
  'other-roadside':      'Other Roadside',
  'v2h-planning':        'V2H Planning',
  'home-charger-install':'Charger Install',
  'home-charger-repair': 'Charger Repair',
  'panel-battery-review':'Panel Review',
  'outage-readiness':    'Outage Readiness',
  'other-home':          'Other Home',
};

const nextMap = {
  submitted:  ['reviewed', 'cancelled'],
  reviewed:   ['dispatched', 'cancelled'],
  dispatched: ['complete', 'cancelled'],
  complete:   [],
  cancelled:  [],
};

function relTime(iso) {
  const d = Date.now() - new Date(iso).getTime();
  const m = Math.floor(d / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

function renderCard(r) {
  const nexts = (nextMap[r.status] || []).map(s => {
    const cls = s === 'dispatched' ? 'a-dispatch' : s === 'complete' ? 'a-complete' : s === 'cancelled' ? 'a-cancel' : '';
    return `<button class="act-btn ${cls}" data-id="${r.id}" data-status="${s}">${s.toUpperCase()}</button>`;
  }).join('');

  const cust = [];
  if (r.customer_name)  cust.push(`<span class="req-cust-item"><strong>${r.customer_name}</strong></span>`);
  if (r.customer_phone) cust.push(`<span class="req-cust-item"><a href="tel:${r.customer_phone}">${r.customer_phone}</a></span>`);
  if (r.customer_email) cust.push(`<span class="req-cust-item">${r.customer_email}</span>`);
  if (r.powertrain && r.powertrain !== 'ev' && r.powertrain !== 'ice') cust.push(`<span class="req-cust-item">${r.powertrain.toUpperCase()}</span>`);
  if (r.vehicle)        cust.push(`<span class="req-cust-item">${r.vehicle}</span>`);

  return `<div class="req-card" id="rc-${r.id}" data-status="${r.status}">
    <div class="req-left">
      <div class="req-top">
        <span class="req-id" title="${r.id}">${r.id.slice(0,8)}…</span>
        <span class="req-time">${relTime(r.requested_at)}</span>
        <span class="cat-chip c-${r.category}">${r.category.toUpperCase()}</span>
        ${r.powertrain ? `<span class="cat-chip c-roadside" style="color:var(--text-2)">${r.powertrain === 'ev' ? 'EV' : 'GAS'}</span>` : ''}
      </div>
      <div class="req-svc">${svcNames[r.service_type] || r.service_type}</div>
      ${r.location_label ? `<div class="req-loc">${r.location_label}</div>` : ''}
      ${cust.length ? `<div class="req-cust">${cust.join('')}</div>` : ''}
      ${r.intake_notes ? `<div class="req-notes">"${r.intake_notes.slice(0,140)}${r.intake_notes.length > 140 ? '…' : ''}"</div>` : ''}
    </div>
    <div class="req-right">
      <div class="status-badge s-${r.status}">${r.status.toUpperCase()}</div>
      ${nexts ? `<div class="req-actions">${nexts}</div>` : ''}
    </div>
  </div>`;
}

function updateCounts(reqs) {
  const c = { all: reqs.length, submitted: 0, reviewed: 0, dispatched: 0, complete: 0, cancelled: 0 };
  reqs.forEach(r => { if (c[r.status] !== undefined) c[r.status]++; });
  ['all','submitted','reviewed','dispatched','complete','cancelled'].forEach(k => {
    const el = document.getElementById('c-' + k);
    if (el) el.textContent = c[k];
  });
}

function applyFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-row').forEach(r => r.classList.toggle('active', r.dataset.f === f));
  const filtered = f === 'all' ? allRequests : allRequests.filter(r => r.status === f);
  document.getElementById('main-title').textContent =
    (f === 'all' ? 'ALL' : f.toUpperCase()) + ' REQUESTS (' + filtered.length + ')';
  const list = document.getElementById('req-list');
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state"><div class="e-icon">○</div><div class="e-text">NO REQUESTS</div></div>';
    return;
  }
  list.innerHTML = filtered.map(renderCard).join('');
}

async function loadRequests() {
  document.getElementById('req-list').innerHTML = '<div class="spinner"></div>';
  try {
    const res = await fetch(API, { headers: { Authorization: 'Bearer ' + adminKey } });
    if (res.status === 401) { logout(); return; }
    const data = await res.json();
    allRequests = data.requests || [];
    updateCounts(allRequests);
    applyFilter(activeFilter);
  } catch (e) {
    document.getElementById('req-list').innerHTML =
      '<div class="empty-state"><div class="e-text">LOAD FAILED — ' + e.message + '</div></div>';
  }
}

async function updateStatus(id, status) {
  try {
    const res = await fetch(API, {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + adminKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, status }),
    });
    if (!res.ok) throw new Error('Server error');
    const req = allRequests.find(r => r.id === id);
    if (req) req.status = status;
    updateCounts(allRequests);
    applyFilter(activeFilter);
    toast('UPDATED → ' + status.toUpperCase());
  } catch (e) {
    toast('ERROR: ' + e.message);
  }
}

function logout() {
  adminKey = '';
  allRequests = [];
  document.getElementById('dash').classList.add('hidden');
  document.getElementById('login-wrap').classList.remove('hidden');
  document.getElementById('key-input').value = '';
  document.getElementById('login-err').textContent = '';
}

/* ── Login flow ─────────────────────────────────────── */
async function doLogin() {
  const key = document.getElementById('key-input').value.trim();
  if (!key) return;
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = 'CHECKING…';
  try {
    const res = await fetch(API, { headers: { Authorization: 'Bearer ' + key } });
    if (res.ok) {
      adminKey = key;
      const data = await res.json();
      allRequests = data.requests || [];
      document.getElementById('login-wrap').classList.add('hidden');
      document.getElementById('dash').classList.remove('hidden');
      updateCounts(allRequests);
      applyFilter('all');
    } else if (res.status === 401) {
      document.getElementById('login-err').textContent = 'Invalid access key.';
    } else {
      document.getElementById('login-err').textContent = 'Server error (' + res.status + ')';
    }
  } catch {
    document.getElementById('login-err').textContent = 'Connection error.';
  }
  btn.disabled = false;
  btn.textContent = 'ACCESS DASHBOARD';
}

document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('key-input').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });

/* ── Filters ──────────────────────────────────────── */
document.getElementById('sb-filters').addEventListener('click', e => {
  const row = e.target.closest('.filter-row');
  if (row) applyFilter(row.dataset.f);
});

/* ── Action buttons (event delegation) ─────────────── */
document.getElementById('req-list').addEventListener('click', e => {
  const btn = e.target.closest('.act-btn');
  if (btn) updateStatus(btn.dataset.id, btn.dataset.status);
});

/* ── Refresh + Logout ───────────────────────────────── */
document.getElementById('refresh-btn').addEventListener('click', loadRequests);
document.getElementById('logout-btn').addEventListener('click', logout);
</script>
</body>
</html>
