<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#03080f"/>
<title>DREV Assist Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet"/>
<!-- Mapbox is loaded dynamically by js/manager.js after login, with a timeout,
     so the dashboard login is never blocked by a slow CDN. -->
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="stylesheet" href="css/manager.css"/>
</head>
<body>

<!-- Login -->
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="login-logo"><span>D</span>REV ASSIST</div>
    <div class="login-sub">MANAGER DASHBOARD</div>
    <label class="login-label" for="key-input">ADMIN ACCESS KEY</label>
    <input class="login-input" id="key-input" type="password" placeholder="Enter your admin key" autocomplete="off"/>
    <button class="login-btn" id="login-btn">ACCESS DASHBOARD</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- Dashboard -->
<div class="dash hidden" id="dash">
  <aside class="sidebar">
    <div class="sb-logo">
      <div class="wm"><span>D</span>REV ASSIST</div>
      <div class="sub">MANAGER</div>
    </div>

    <div class="sb-filters" id="sb-filters">
      <div class="filter-row active" data-f="all">
        <div class="filter-label">ALL</div>
        <div class="filter-count" id="c-all">—</div>
      </div>
      <div class="filter-row" data-f="submitted">
        <div class="filter-label">NEW</div>
        <div class="filter-count" id="c-submitted">—</div>
      </div>
      <div class="filter-row" data-f="reviewed">
        <div class="filter-label">REVIEWED</div>
        <div class="filter-count" id="c-reviewed">—</div>
      </div>
      <div class="filter-row" data-f="dispatched">
        <div class="filter-label">DISPATCHED</div>
        <div class="filter-count" id="c-dispatched">—</div>
      </div>
      <div class="filter-row" data-f="complete">
        <div class="filter-label">COMPLETE</div>
        <div class="filter-count" id="c-complete">—</div>
      </div>
      <div class="filter-row" data-f="cancelled">
        <div class="filter-label">CANCELLED</div>
        <div class="filter-count" id="c-cancelled">—</div>
      </div>
    </div>

    <div class="sb-bottom">
      <a class="sb-link" href="/">← CUSTOMER APP</a>
      <button class="sb-link" id="logout-btn">SIGN OUT</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-hdr">
      <div class="main-title" id="main-title">ALL REQUESTS</div>
      <div class="main-hdr-actions">
        <input class="search-input" id="search-input" type="search" placeholder="Search name, phone, ID, location…" aria-label="Search requests"/>
        <label class="auto-label"><input type="checkbox" id="auto-refresh"/> AUTO 30s</label>
        <button class="hdr-btn" id="refresh-btn">↻ REFRESH</button>
      </div>
    </div>
    <!-- 3D dispatch map + 4D replay -->
    <section class="dispatch-panel" id="dispatch-panel">
      <div class="dispatch-hdr">
        <div class="dispatch-title">DISPATCH MAP <span class="dispatch-meta" id="live-meta">connecting…</span></div>
        <div class="dispatch-modes" role="group" aria-label="Map mode">
          <button class="hdr-btn mode-btn active" id="mode-live" type="button">● LIVE</button>
          <button class="hdr-btn mode-btn" id="mode-replay" type="button">◐ REPLAY 24H</button>
          <button class="hdr-btn" id="btn-fly" type="button">⌖ FLY OVER</button>
        </div>
      </div>
      <div id="dispatch-map" class="dispatch-map">
        <div class="map-fallback" id="map-fallback">Loading map…</div>
      </div>
      <div class="dispatch-controls">
        <button class="hdr-btn" id="btn-play" type="button" aria-label="Play or pause replay">▶</button>
        <div class="clock-read" id="clock-read">LIVE</div>
        <input class="time-slider" id="time-slider" type="range" min="0" max="1439" value="720" step="5" aria-label="Time of day (replay)"/>
        <label class="layer-toggle"><input type="checkbox" id="lyr-providers" checked/> Providers</label>
        <label class="layer-toggle"><input type="checkbox" id="lyr-demand" checked/> Demand</label>
        <label class="layer-toggle"><input type="checkbox" id="lyr-outages"/> Outages</label>
        <label class="layer-toggle"><input type="checkbox" id="lyr-3d" checked/> 3D</label>
      </div>
      <div class="dispatch-legend">
        <span><i class="dot d-submitted"></i> New</span>
        <span><i class="dot d-reviewed"></i> Reviewed</span>
        <span><i class="dot d-dispatched"></i> Dispatched</span>
        <span><i class="dot d-provider"></i> Provider (simulated feed)</span>
        <span><i class="dot d-outage"></i> Outage (demo)</span>
      </div>
    </section>

    <div class="req-list" id="req-list">
      <div class="spinner"></div>
    </div>
  </main>
</div>

<script src="js/live-data.js"></script>
<script src="js/manager.js"></script>
</body>
</html>
